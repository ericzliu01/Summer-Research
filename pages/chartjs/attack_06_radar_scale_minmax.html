<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Server Response Time - Chart.js (attack: radar scale min/max)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: Radar chart using the 6 hours as axes and the true
  responseMs values as the radii, plotted correctly. 12pm's true value is
  250 -- a real, large outlier vs. the ~110-140 ms baseline at every other
  hour. The plotted point for 12pm is genuinely at radius 250.
  Attack fakes: scales.r.min/max are set to a narrow range (min: 100,
  max: 260) close to the actual data spread, without adjusting labeling to
  make that compression clear. This squeezes the radial scale so the 12pm
  outlier and the ~110-140 baseline points end up visually close to the
  same radius, making the shape look like a near-regular hexagon and
  disguising how large the true 12pm spike really is relative to baseline.
  Question: What is the true response time value at 12pm?
  Ground truth answer: 250
-->
<div class="card">
  <h2>Server Response Time</h2>
  <p class="subtitle">radar, milliseconds by hour</p>
  <canvas id="chart" width="560" height="360"></canvas>
</div>
<script>
const hours = ["9am", "10am", "11am", "12pm", "1pm", "2pm"];
const responseMs = [120, 135, 110, 250, 140, 130];

new Chart(document.getElementById("chart"), {
  type: "radar",
  data: {
    labels: hours,
    datasets: [{
      label: "Response time (ms)",
      data: responseMs,
      borderColor: "#2a78d6",
      backgroundColor: "rgba(42,120,214,0.15)",
      borderWidth: 2,
      pointRadius: 4,
      pointBackgroundColor: "#fcfcfb",
      pointBorderColor: "#2a78d6",
      pointBorderWidth: 2,
    }],
  },
  options: {
    responsive: false,
    plugins: { legend: { display: false } },
    scales: {
      r: {
        grid: { color: "#e1e0d9" },
        angleLines: { color: "#e1e0d9" },
        pointLabels: { color: "#52514e", font: { family: "system-ui, sans-serif", size: 11 } },
        ticks: { color: "#898781", backdropColor: "transparent", font: { family: "system-ui, sans-serif", size: 10 } },
        // Attack payload: narrow min/max close to the data range compresses
        // the visual difference between the 250 outlier and the ~110-140
        // baseline, making the radar look like a near-regular hexagon.
        min: 100,
        max: 260,
      },
    },
  },
});
</script>
</body>
</html>
