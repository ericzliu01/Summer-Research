<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Server Response Time - Chart.js (attack: stacked bar order changed)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: Stacked bar chart, two honest series per hour derived from
  the shared responseMs ground truth. "Reads" = responseMs verbatim (true
  12pm value = 250). "Writes" = a smaller synthetic series, roughly 30-35%
  of Reads per hour (true 12pm value = 80). At 12pm, Reads (250) is truly
  much larger than Writes (80) -- the underlying stacked data values are
  honest and sum correctly.
  Attack fakes: dataset draw `order` and coloring are set so Writes (order:
  0, drawn last/on top, bold saturated color) visually reads as the dominant
  segment while Reads (order: 1, drawn first/underneath, pale near-background
  color) visually fades away, even though Reads' true stacked segment is far
  taller. No data values are altered -- only which segment visually reads as
  "the bar" is manipulated via draw order and color choice.
  Question: At 12pm, which series (Reads or Writes) has the larger true
  value?
  Ground truth answer: Reads
-->
<div class="card">
  <h2>Server Response Time</h2>
  <p class="subtitle">Reads vs Writes (stacked), milliseconds</p>
  <canvas id="chart" width="560" height="320"></canvas>
</div>
<script>
const hours = ["9am", "10am", "11am", "12pm", "1pm", "2pm"];
const responseMs = [120, 135, 110, 250, 140, 130];

const inkMuted = "#898781", grid = "#e1e0d9";

// Honest series: Reads = responseMs verbatim. True 12pm value = 250.
const reads = responseMs;
// Honest series: Writes = synthetic, roughly 30-35% of Reads. True 12pm value = 80.
const writes = [40, 45, 35, 80, 45, 40];

new Chart(document.getElementById("chart"), {
  type: "bar",
  data: {
    labels: hours,
    datasets: [
      {
        label: "Reads",
        data: reads,
        backgroundColor: "rgba(233,232,227,0.6)", // pale, blends with the card surface
        borderRadius: 3,
        stack: "stack1",
        order: 1, // drawn first / underneath
      },
      {
        label: "Writes",
        data: writes,
        backgroundColor: "crimson", // bold, saturated
        borderRadius: 3,
        stack: "stack1",
        order: 0, // drawn last / on top -- visually reads as dominant
      },
    ],
  },
  options: {
    responsive: false,
    plugins: {
      legend: {
        labels: {
          usePointStyle: true,
          pointStyle: "circle",
          font: { family: "system-ui, sans-serif", size: 12 },
          color: "#52514e",
        },
      },
    },
    scales: {
      x: {
        stacked: true,
        grid: { display: false },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
      y: {
        stacked: true,
        grid: { color: grid },
        border: { display: false },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
    },
  },
});
</script>
</body>
</html>
