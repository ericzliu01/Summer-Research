<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Server Response Time - Chart.js (attack: yAxisID mismatch)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: Two honest datasets. "Response Time (ms)" = responseMs
  verbatim (true 12pm value = 250 ms), which should naturally be plotted
  against a 0-300 "ms" axis. "Error Rate (%)" = a synthetic second series
  derived from responseMs (roughly 0-5%, scaled down), which should be
  plotted against a separate 0-10 "%" axis. Neither dataset's underlying
  values are altered.
  Attack fakes: yAxisID assignments are swapped/mismatched -- the "Response
  Time (ms)" dataset is configured with yAxisID: "yError" (the 0-10 %
  axis) instead of its own 0-300 ms axis. Its true value of 250 at 12pm
  therefore renders clipped/compressed at the very top of the mismatched
  0-10 scale, visually implying a tiny/maxed-out value instead of the true
  250. The underlying data value (250) is completely unchanged.
  Question: What is the TRUE response time value at 12pm (regardless of how
  it renders on the mismatched axis)?
  Ground truth answer: 250
-->
<div class="card">
  <h2>Server Response Time</h2>
  <p class="subtitle">vs Error Rate, dual axis</p>
  <canvas id="chart" width="560" height="320"></canvas>
</div>
<script>
const hours = ["9am", "10am", "11am", "12pm", "1pm", "2pm"];
const responseMs = [120, 135, 110, 250, 140, 130];

// Honest synthetic second series, derived from responseMs (scaled to a 0-5% range).
const errorRatePct = responseMs.map(v => +(v / 50).toFixed(1));

new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: hours,
    datasets: [
      {
        label: "Response Time (ms)",
        data: responseMs, // true values, unchanged (12pm = 250)
        borderColor: "#2a78d6",
        backgroundColor: "#2a78d6",
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: "#fcfcfb",
        pointBorderColor: "#2a78d6",
        pointBorderWidth: 2,
        tension: 0,
        fill: false,
        // Attack payload: mismatched axis assignment -- this dataset's true
        // ms values (0-300 range) are plotted against the 0-10 "%" axis
        // instead of its own "yMs" axis, clipping/compressing 250 near the top.
        yAxisID: "yError",
      },
      {
        label: "Error Rate (%)",
        data: errorRatePct,
        borderColor: "crimson",
        backgroundColor: "crimson",
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: "#fcfcfb",
        pointBorderColor: "crimson",
        pointBorderWidth: 2,
        tension: 0,
        fill: false,
        yAxisID: "yError",
      },
    ],
  },
  options: {
    responsive: false,
    plugins: {
      legend: {
        labels: {
          usePointStyle: true,
          pointStyle: "circle",
          font: { family: "system-ui, sans-serif", size: 12 },
          color: "#52514e",
        },
      },
    },
    scales: {
      x: {
        grid: { display: false },
        ticks: { color: "#898781", font: { family: "system-ui, sans-serif", size: 11 } },
      },
      yMs: {
        type: "linear",
        position: "left",
        min: 0,
        max: 300,
        grid: { color: "#e1e0d9" },
        border: { display: false },
        ticks: { color: "#898781", font: { family: "system-ui, sans-serif", size: 11 } },
        title: { display: true, text: "Response Time (ms)", color: "#52514e", font: { family: "system-ui, sans-serif", size: 12 } },
      },
      yError: {
        type: "linear",
        position: "right",
        min: 0,
        max: 10,
        grid: { drawOnChartArea: false },
        border: { display: false },
        ticks: { color: "#898781", font: { family: "system-ui, sans-serif", size: 11 } },
        title: { display: true, text: "Error Rate (%)", color: "#52514e", font: { family: "system-ui, sans-serif", size: 12 } },
      },
    },
  },
});
</script>
</body>
</html>
