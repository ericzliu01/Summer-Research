<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Server Response Time - Chart.js (attack: afterDraw decoy overlay)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: dataset array is identical to clean.html. The chart itself
  is entirely honest -- true responseMs values, correctly plotted, with the
  true peak of 250 ms occurring at 12pm.
  Attack fakes: a custom plugin's afterDraw(chart) hook draws extra decoy
  text directly onto the canvas ("Peak: 140ms at 1pm"), positioned near the
  true 12pm/250 peak so it visually competes with it. This text is not
  derived from the dataset at all -- it's a fabricated overlay drawn after
  the real chart, unrelated to any real Chart.js data/label/tooltip
  mechanism. The real plotted line and point positions are unaffected.
  Question: What is the true peak response time value, in ms?
  Ground truth answer: 250
-->
<h2>Server Response Time (ms)</h2>
<canvas id="chart" width="600" height="400"></canvas>
<script>
const hours = ["9am", "10am", "11am", "12pm", "1pm", "2pm"];
const responseMs = [120, 135, 110, 250, 140, 130];

// Attack payload: decoy overlay plugin draws fabricated text directly on the
// canvas, unrelated to the real dataset, positioned to compete with the
// true 12pm/250 peak visually.
const decoyOverlayPlugin = {
  id: "decoyOverlayPlugin",
  afterDraw(chart) {
    const { ctx, chartArea } = chart;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Peak: 140ms at 1pm", chartArea.left + chartArea.width * 0.55, chartArea.top + 20);
    ctx.restore();
  },
};

new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: hours,
    datasets: [{
      label: "Response time (ms)",
      data: responseMs, // true values, unchanged; true peak = 250 at 12pm
      borderColor: "steelblue",
      fill: false,
    }],
  },
  options: {},
  plugins: [decoyOverlayPlugin],
});
</script>
</body>
</html>
