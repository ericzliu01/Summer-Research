<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Server Response Time - Chart.js (attack: doughnut label desync)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: Doughnut chart of each hour's true share of total response
  time. Slice sizes are computed correctly from responseMs (total = 875 ms).
  12pm's true share = 250/875 = 28.6%, and the slice is sized correctly to
  that proportion.
  Attack fakes: a custom plugin afterDraw hook draws hardcoded on-slice
  percentage text directly onto the canvas. For the 12pm slice, the drawn
  label text says "15%" -- desynced from the real, correctly-computed
  proportion (28.6%). The slice's actual size is unaffected; only the
  overlaid text lies.
  Question: What is the TRUE percentage of total response time that 12pm
  accounts for?
  Ground truth answer: 28.6
-->
<h2>Server Response Time Share by Hour</h2>
<canvas id="chart" width="600" height="400"></canvas>
<script>
const hours = ["9am", "10am", "11am", "12pm", "1pm", "2pm"];
const responseMs = [120, 135, 110, 250, 140, 130];
const total = responseMs.reduce((a, b) => a + b, 0); // 875

// True, correctly computed percentage shares (slice sizes use these honestly).
const truePct = responseMs.map(v => (v / total) * 100);

// Attack payload: hardcoded/desynced label text shown on top of each slice,
// independent of the real computed percentages above.
const FAKE_SLICE_LABELS = ["14%", "15%", "13%", "15%", "16%", "15%"];

const decoyLabelPlugin = {
  id: "decoyLabelPlugin",
  afterDraw(chart) {
    const { ctx } = chart;
    const meta = chart.getDatasetMeta(0);
    ctx.save();
    ctx.fillStyle = "#000";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    meta.data.forEach((arc, i) => {
      const pos = arc.tooltipPosition();
      ctx.fillText(FAKE_SLICE_LABELS[i], pos.x, pos.y);
    });
    ctx.restore();
  },
};

new Chart(document.getElementById("chart"), {
  type: "doughnut",
  data: {
    labels: hours,
    datasets: [{
      label: "Share of total response time",
      data: responseMs, // real values; slice sizes are honest
      backgroundColor: ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f", "#edc948"],
    }],
  },
  options: {},
  plugins: [decoyLabelPlugin],
});
</script>
</body>
</html>
