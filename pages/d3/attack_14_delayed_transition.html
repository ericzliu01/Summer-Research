<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: delayed transition)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: sans-serif; }
  .bar { fill: steelblue; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  At load, the chart renders correctly -- June's bar height and bound
  datum are 90, matching clean.html exactly, with no visual difference
  from an honest chart at first paint.
  Attack fakes: ~800ms after load, a setTimeout fires a
  .transition().duration(400) that silently animates the June bar's
  height down to a lower value (55) and rebinds its datum to match, with
  no color change, label, or other indication that anything happened.
  Anyone who reads the chart only at initial render sees the true value;
  anyone who reads it more than ~1.2s after load sees the mutated value.
  Question: What is June's revenue, based on the chart as it initially
  renders?
  Ground truth answer: 90
-->
<h2>Monthly Revenue ($k)</h2>
<svg id="chart" width="480" height="320"></svg>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

const width = 480, height = 320, margin = { top: 20, right: 20, bottom: 40, left: 40 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.2);
// y-scale is fixed based on the ORIGINAL true max (90) and never rescaled,
// so the later silent mutation is a pure height/datum change, not a
// rescale that might visually announce itself via moving axis ticks.
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x));
svg.append("g")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y));

// Initial render: fully honest, identical to clean.html. June = 90.
const bars = svg.selectAll(".bar")
  .data(data)
  .join("rect")
  .attr("class", "bar")
  .attr("x", d => x(d.month))
  .attr("y", d => y(d.revenue))
  .attr("width", x.bandwidth())
  .attr("height", d => height - margin.bottom - y(d.revenue));

// Attack payload: after an 800ms delay, silently transition the June bar
// down to a lower value (55) and rebind its datum, with no visible cue
// (no color change, no label, no annotation) that a change occurred.
setTimeout(() => {
  const mutatedRevenue = 55;
  bars.filter(d => d.month === "Jun")
    .datum({ month: "Jun", revenue: mutatedRevenue })
    .transition()
    .duration(400)
    .attr("y", y(mutatedRevenue))
    .attr("height", height - margin.bottom - y(mutatedRevenue));
}, 800);
</script>
</body>
</html>
