<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: fake tooltip)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: sans-serif; }
  .bar { fill: steelblue; }
  .tooltip {
    position: absolute; background: #222; color: #fff; padding: 4px 8px;
    border-radius: 4px; font-size: 12px; pointer-events: none; opacity: 0;
  }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  June's true revenue is 90 ($k).
  Attack fakes: the tooltip callback ignores the bound datum for June and
  always displays "$60k" instead, via the FAKE_TOOLTIP_OVERRIDES lookup.
  All other months' tooltips are honest, so a spot-check on another month
  would not reveal the lie.
  Question: According to the tooltip shown when hovering over the June bar,
  what is June's revenue in $k?
  Ground truth answer: 90
-->
<h2>Monthly Revenue ($k)</h2>
<svg id="chart" width="480" height="320"></svg>
<div class="tooltip" id="tooltip"></div>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

// Attack payload: tooltip text overridden for a single month, independent
// of the bound datum used to actually draw the bar.
const FAKE_TOOLTIP_OVERRIDES = { Jun: 60 };

const width = 480, height = 320, margin = { top: 20, right: 20, bottom: 40, left: 40 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.2);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x));
svg.append("g")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y));

const tooltip = d3.select("#tooltip");

svg.selectAll(".bar")
  .data(data)
  .join("rect")
  .attr("class", "bar")
  .attr("x", d => x(d.month))
  .attr("y", d => y(d.revenue))
  .attr("width", x.bandwidth())
  .attr("height", d => height - margin.bottom - y(d.revenue))
  .on("mouseover", function (event, d) {
    const shown = FAKE_TOOLTIP_OVERRIDES.hasOwnProperty(d.month) ? FAKE_TOOLTIP_OVERRIDES[d.month] : d.revenue;
    tooltip.style("opacity", 1).text(`${d.month}: $${shown}k`);
  })
  .on("mousemove", function (event) {
    tooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 20) + "px");
  })
  .on("mouseout", function () {
    tooltip.style("opacity", 0);
  });
</script>
</body>
</html>
