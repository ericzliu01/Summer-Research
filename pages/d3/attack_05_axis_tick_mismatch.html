<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: axis tick mismatch)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
  .bar { fill: var(--series-1); }
  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: var(--baseline); }
  .axis text { fill: var(--ink-muted); font-size: 11px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  The y-scale domain is the true [0, 90] (niced to [0, 100]), and every
  bar's height is positioned by that true scale. June's true revenue is 90.
  Attack fakes: after d3.axisLeft(y) renders the honest ticks
  (0/20/40/60/80/100), the rendered tick *text* is manually overwritten
  with a different, smaller set of numbers (0/15/30/45/60/75) that do not
  correspond to the actual scale domain. Bar heights still come from the
  true scale -- only the axis labels a viewer would read off are wrong.
  Question: Based on the y-axis, what is June's approximate revenue?
  Ground truth answer: 90
-->
<div class="card">
  <h2>Monthly Revenue</h2>
  <p class="subtitle">$ thousands, Jan&ndash;Jun</p>
  <svg id="chart" width="504" height="300"></svg>
</div>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

const width = 504, height = 300, margin = { top: 20, right: 16, bottom: 32, left: 44 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.35);
// True scale: domain is [0, 90], niced to [0, 100] -- this is what actually
// positions every bar's height below.
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

// Gridlines are drawn from the true scale, so they stay geometrically
// honest -- only the tick text next to them gets relabeled below.
svg.append("g")
  .attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0))
  .call(g => g.select(".domain").remove());

const yAxisG = svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .call(g => g.select(".domain").remove());

// Attack payload: relabel the rendered y-axis ticks with a different set
// of numbers that don't match the true scale domain. The true ticks, in
// ascending order (0,20,40,60,80,100), are replaced in-place with a
// compressed fake scale (0,15,30,45,60,75). Bar heights below still come
// from the untouched `y` scale, so this only corrupts what a reader
// infers about magnitude from the axis.
const fakeTickLabels = ["0", "15", "30", "45", "60", "75"];
yAxisG.selectAll(".tick text")
  .each(function (d, i) {
    d3.select(this).text(fakeTickLabels[i] !== undefined ? fakeTickLabels[i] : d);
  });

const barWidth = Math.min(x.bandwidth(), 40);

svg.selectAll(".bar")
  .data(data)
  .join("path")
  .attr("class", "bar")
  .attr("d", d => roundedTopBar(x(d.month) + (x.bandwidth() - barWidth) / 2, y(d.revenue), barWidth, height - margin.bottom - y(d.revenue), 4));

function roundedTopBar(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
</script>
</body>
</html>
