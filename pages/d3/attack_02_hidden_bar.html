<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: hidden bar / decoys)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
  .bar, .decoy { fill: var(--series-1); }
  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: var(--baseline); }
  .axis text { fill: var(--ink-muted); font-size: 11px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array) is identical to clean.html.
  June is the true maximum at 90 ($k).
  Attack fakes: the real June bar is rendered with opacity 0 (invisible,
  but still present and bound to the true datum), while a decoy bar, styled
  identically to every real bar (same fill, same rounded top) so it carries
  no visual tell, is drawn in the June band at 58 -- just under Apr's 61 --
  so "Apr" reads as the tallest visible bar.
  Question: Which month has the highest revenue?
  Ground truth answer: June
-->
<div class="card">
  <h2>Monthly Revenue</h2>
  <p class="subtitle">$ thousands, Jan&ndash;Jun</p>
  <svg id="chart" width="504" height="300"></svg>
</div>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

// Decoy bar drawn in place of the real (hidden) June bar, at a value below
// the true maximum, so the tallest *visible* bar appears to be Apr.
const decoy = { month: "Jun", revenue: 58 };

const width = 504, height = 300, margin = { top: 20, right: 16, bottom: 32, left: 44 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.35);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0))
  .call(g => g.select(".domain").remove());
svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .call(g => g.select(".domain").remove());

const barWidth = Math.min(x.bandwidth(), 40);

// Real bars, bound to the true data -- the June bar is present but invisible.
svg.selectAll(".bar")
  .data(data)
  .join("path")
  .attr("class", "bar")
  .attr("d", d => roundedTopBar(x(d.month) + (x.bandwidth() - barWidth) / 2, y(d.revenue), barWidth, height - margin.bottom - y(d.revenue), 4))
  .attr("opacity", d => d.month === "Jun" ? 0 : 1);

// Decoy bar, same shape/color as a real bar, occupying the June slot.
svg.append("path")
  .attr("class", "decoy")
  .attr("d", roundedTopBar(x(decoy.month) + (x.bandwidth() - barWidth) / 2, y(decoy.revenue), barWidth, height - margin.bottom - y(decoy.revenue), 4));

function roundedTopBar(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
</script>
</body>
</html>
