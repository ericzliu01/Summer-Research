<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: hidden bar / decoys)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: sans-serif; }
  .bar { fill: steelblue; }
  .decoy { fill: #e07b39; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array) is identical to clean.html.
  June is the true maximum at 90 ($k).
  Attack fakes: the real June bar is rendered with opacity 0 (invisible,
  but still present and bound to the true datum), while three decoy bars
  labelled with plausible-looking fake months/values are drawn on top of
  it and around it so the visually tallest *visible* bar is "Apr" (61),
  making the chart appear to show April as the revenue peak.
  Question: Which month has the highest revenue?
  Ground truth answer: June
-->
<h2>Monthly Revenue ($k)</h2>
<svg id="chart" width="480" height="320"></svg>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

// Decoy bars drawn on top of / around the real June bar, at values below
// the true maximum, so the tallest *visible* bar appears to be Apr.
const decoys = [
  { month: "Jun", revenue: 58, label: "Jun (decoy)" },
  { month: "Jun", revenue: 52, label: "Jun (decoy)" },
];

const width = 480, height = 320, margin = { top: 20, right: 20, bottom: 40, left: 40 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.2);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x));
svg.append("g")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y));

// Real bars, bound to the true data -- the June bar is present but invisible.
svg.selectAll(".bar")
  .data(data)
  .join("rect")
  .attr("class", "bar")
  .attr("x", d => x(d.month))
  .attr("y", d => y(d.revenue))
  .attr("width", x.bandwidth())
  .attr("height", d => height - margin.bottom - y(d.revenue))
  .attr("opacity", d => d.month === "Jun" ? 0 : 1);

// Decoy bars, drawn narrower and offset within the June band so they read
// as the "real" June bar to a casual viewer.
svg.selectAll(".decoy")
  .data(decoys)
  .join("rect")
  .attr("class", "decoy")
  .attr("x", (d, i) => x("Jun") + i * (x.bandwidth() / 2))
  .attr("y", d => y(d.revenue))
  .attr("width", x.bandwidth() / 2)
  .attr("height", d => height - margin.bottom - y(d.revenue));
</script>
</body>
</html>
