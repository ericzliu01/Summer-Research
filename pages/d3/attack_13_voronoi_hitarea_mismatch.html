<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Scatter Chart (attack: Voronoi hit-area mismatch)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
  .line { fill: none; stroke: var(--series-1); stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
  .point { fill: var(--series-1); stroke: var(--surface); stroke-width: 2px; }
  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: var(--baseline); }
  .axis text { fill: var(--ink-muted); font-size: 11px; }
  .tooltip {
    position: absolute; background: var(--ink); color: #fff; padding: 6px 10px;
    border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity 0.1s ease;
  }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  Points are drawn at their true positions -- June is the rightmost and
  tallest point (90), May is second-to-last (47).
  Attack fakes: the invisible hover hit-area is built from
  d3.Delaunay.from() using a JITTERED copy of the point coordinates
  (each site's x is shifted to the NEXT month's true x position) instead
  of the true coordinates. As a result, the Voronoi cell that actually
  covers June's true on-screen location belongs to a site carrying May's
  datum, so hovering exactly over June's visual point shows a tooltip of
  "$47k" instead of the true "$90k". The circles themselves are still
  drawn at the true, undistorted positions.
  Question: When hovering directly over the June point (the rightmost,
  tallest point on the chart), what value does the tooltip show?
  Ground truth answer: 90
-->
<div class="card">
  <h2>Monthly Revenue</h2>
  <p class="subtitle">$ thousands, Jan&ndash;Jun</p>
  <svg id="chart" width="504" height="300"></svg>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

const width = 504, height = 300, margin = { top: 20, right: 16, bottom: 32, left: 44 };
const svg = d3.select("#chart");
const x = d3.scalePoint().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.5);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0))
  .call(g => g.select(".domain").remove());
svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .call(g => g.select(".domain").remove());

const trueLine = d3.line().x(d => x(d.month)).y(d => y(d.revenue));
svg.append("path").attr("class", "line").attr("d", trueLine(data));

// Points drawn at their true, honest positions.
svg.selectAll(".point")
  .data(data)
  .join("circle")
  .attr("class", "point")
  .attr("cx", d => x(d.month))
  .attr("cy", d => y(d.revenue))
  .attr("r", 5);

const tooltip = d3.select("#tooltip");

// Attack payload: build the Delaunay/Voronoi hit-area from JITTERED site
// coordinates -- each site is placed at the NEXT month's true (x, y)
// position (index i uses data[(i+1) % 6]'s position) while still carrying
// its OWN datum. This means the site carrying May's datum physically sits
// exactly at June's true on-screen point, so the hit-area covering June's
// true position resolves to May's datum instead of June's. (Jittering only
// x while leaving y at the site's own height doesn't reliably work here --
// revenue isn't monotonic across months, so a same-x/wrong-y site can end
// up farther from the hover point than some other site entirely; jittering
// both coordinates together guarantees the intended site is nearest.)
const jitteredSites = data.map((d, i) => {
  const nextMonth = data[(i + 1) % data.length];
  return { x: x(nextMonth.month), y: y(nextMonth.revenue), datum: d };
});
const delaunay = d3.Delaunay.from(jitteredSites, s => s.x, s => s.y);

svg.append("rect")
  .attr("x", 0).attr("y", 0)
  .attr("width", width).attr("height", height)
  .attr("fill", "transparent")
  .on("mousemove", function (event) {
    const [mx, my] = d3.pointer(event, svg.node());
    const idx = delaunay.find(mx, my);
    const site = jitteredSites[idx];
    tooltip.style("opacity", 1)
      .text(`${site.datum.month}: $${site.datum.revenue}k`)
      .style("left", (event.pageX + 10) + "px")
      .style("top", (event.pageY - 24) + "px");
  })
  .on("mouseout", function () {
    tooltip.style("opacity", 0);
  });
</script>
</body>
</html>
