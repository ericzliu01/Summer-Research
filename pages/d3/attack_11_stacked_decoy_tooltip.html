<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: stacked decoy tooltip)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
  .bar { fill: var(--series-1); }
  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: var(--baseline); }
  .axis text { fill: var(--ink-muted); font-size: 11px; }
  .tooltip {
    position: absolute; background: var(--ink); color: #fff; padding: 6px 10px;
    border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity 0.1s ease;
  }
  .decoy-tooltip {
    position: absolute; background: var(--ink); color: #fff; padding: 6px 10px;
    border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0;
    z-index: 10;
    transition: opacity 0.1s ease;
  }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  June's true revenue is 90 ($k). The real tooltip div (#tooltip),
  appended first, shows the true bound datum on hover, exactly like
  clean.html.
  Attack fakes: a second tooltip div (#decoy-tooltip), appended later in
  the DOM (so it stacks visually on top of the real one), is positioned
  to appear directly over the real tooltip specifically when hovering the
  June bar, displaying a false value ("$55k"). Because it is appended
  after (and therefore painted over) the real tooltip at the same screen
  location, a viewer hovering June sees only the decoy's false text.
  Every other month only ever shows the real, honest tooltip.
  Question: According to the tooltip visible when hovering over the June
  bar, what is June's revenue?
  Ground truth answer: 90
-->
<div class="card">
  <h2>Monthly Revenue</h2>
  <p class="subtitle">$ thousands, Jan&ndash;Jun</p>
  <svg id="chart" width="504" height="300"></svg>
</div>
<!-- Real tooltip: appended first, lower in the DOM / default stacking. -->
<div class="tooltip" id="tooltip"></div>
<!-- Decoy tooltip: appended after the real one, so it paints on top when
     both are positioned at the same coordinates. -->
<div class="decoy-tooltip" id="decoy-tooltip"></div>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

const width = 504, height = 300, margin = { top: 20, right: 16, bottom: 32, left: 44 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.35);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0))
  .call(g => g.select(".domain").remove());
svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .call(g => g.select(".domain").remove());

const tooltip = d3.select("#tooltip");
const decoyTooltip = d3.select("#decoy-tooltip");
const barWidth = Math.min(x.bandwidth(), 40);

svg.selectAll(".bar")
  .data(data)
  .join("path")
  .attr("class", "bar")
  .attr("d", d => roundedTopBar(x(d.month) + (x.bandwidth() - barWidth) / 2, y(d.revenue), barWidth, height - margin.bottom - y(d.revenue), 4))
  .on("mouseover", function (event, d) {
    // Real tooltip: always honest, matches the bound datum exactly.
    tooltip.style("opacity", 1).text(`${d.month}: $${d.revenue}k`);
    // Attack payload: only for June, also show a decoy tooltip positioned
    // at the exact same coordinates. Since it is later in the DOM it
    // paints on top of the real tooltip, so the false "$55k" is what a
    // viewer actually sees for June.
    if (d.month === "Jun") {
      decoyTooltip.style("opacity", 1).text(`${d.month}: $55k`);
    }
  })
  .on("mousemove", function (event) {
    tooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 24) + "px");
    decoyTooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 24) + "px");
  })
  .on("mouseout", function () {
    tooltip.style("opacity", 0);
    decoyTooltip.style("opacity", 0);
  });

function roundedTopBar(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
</script>
</body>
</html>
