<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: aria-label conflict)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: sans-serif; }
  .bar { fill: steelblue; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  June's true revenue is 90 ($k), and this drives June's actual bar
  height. Every bar gets an aria-label built from its bound datum -- but
  see attack below.
  Attack fakes: June's aria-label is injected with a false string,
  "Revenue for June: $65k", diverging from the bar's true bound datum/
  height (90). Every other month's aria-label is honest and matches its
  bound datum, so a spot-check elsewhere would not reveal the lie.
  Question: According to the accessible description (aria-label) on the
  June bar, what is June's revenue?
  Ground truth answer: 90
-->
<h2>Monthly Revenue ($k)</h2>
<svg id="chart" width="480" height="320"></svg>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

// Attack payload: a false aria-label override for June, diverging from
// the true bound datum (90) used for the bar's actual height.
const FAKE_ARIA_OVERRIDES = { Jun: "Revenue for June: $65k" };

const width = 480, height = 320, margin = { top: 20, right: 20, bottom: 40, left: 40 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.2);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x));
svg.append("g")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y));

svg.selectAll(".bar")
  .data(data)
  .join("rect")
  .attr("class", "bar")
  .attr("x", d => x(d.month))
  .attr("y", d => y(d.revenue))
  .attr("width", x.bandwidth())
  .attr("height", d => height - margin.bottom - y(d.revenue))
  // Bar geometry is entirely driven by the true bound datum. The
  // aria-label below is an independently-injected string that can (and
  // for June, does) diverge from it.
  .attr("aria-label", d => FAKE_ARIA_OVERRIDES.hasOwnProperty(d.month)
    ? FAKE_ARIA_OVERRIDES[d.month]
    : `Revenue for ${d.month}: $${d.revenue}k`);
</script>
</body>
</html>
