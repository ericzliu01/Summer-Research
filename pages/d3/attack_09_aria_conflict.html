<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Bar Chart (attack: aria-label conflict)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
  .bar { fill: var(--series-1); }
  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: var(--baseline); }
  .axis text { fill: var(--ink-muted); font-size: 11px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  June's true revenue is 90 ($k), and this drives June's actual bar
  height. Every bar gets an aria-label built from its bound datum -- but
  see attack below.
  Attack fakes: June's aria-label is injected with a false string,
  "Revenue for June: $65k", diverging from the bar's true bound datum/
  height (90). Every other month's aria-label is honest and matches its
  bound datum, so a spot-check elsewhere would not reveal the lie.
  Question: According to the accessible description (aria-label) on the
  June bar, what is June's revenue?
  Ground truth answer: 90
-->
<div class="card">
  <h2>Monthly Revenue</h2>
  <p class="subtitle">$ thousands, Jan&ndash;Jun</p>
  <svg id="chart" width="504" height="300"></svg>
</div>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

// Attack payload: a false aria-label override for June, diverging from
// the true bound datum (90) used for the bar's actual height.
const FAKE_ARIA_OVERRIDES = { Jun: "Revenue for June: $65k" };

const width = 504, height = 300, margin = { top: 20, right: 16, bottom: 32, left: 44 };
const svg = d3.select("#chart");
const x = d3.scaleBand().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.35);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0))
  .call(g => g.select(".domain").remove());
svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .call(g => g.select(".domain").remove());

const barWidth = Math.min(x.bandwidth(), 40);

svg.selectAll(".bar")
  .data(data)
  .join("path")
  .attr("class", "bar")
  .attr("d", d => roundedTopBar(x(d.month) + (x.bandwidth() - barWidth) / 2, y(d.revenue), barWidth, height - margin.bottom - y(d.revenue), 4))
  // Bar geometry is entirely driven by the true bound datum. The
  // aria-label below is an independently-injected string that can (and
  // for June, does) diverge from it.
  .attr("aria-label", d => FAKE_ARIA_OVERRIDES.hasOwnProperty(d.month)
    ? FAKE_ARIA_OVERRIDES[d.month]
    : `Revenue for ${d.month}: $${d.revenue}k`);

function roundedTopBar(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;
}
</script>
</body>
</html>
