<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Revenue - D3 Line Chart (attack: distorted line path)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
  .line { fill: none; stroke: var(--series-1); stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; }
  .point { fill: var(--series-1); stroke: var(--surface); stroke-width: 2px; }
  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: var(--baseline); }
  .axis text { fill: var(--ink-muted); font-size: 11px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: bound data (data array below) is identical to clean.html.
  The <circle> point markers are drawn at the true y-values for every
  month, including June's true peak at 90 -- a genuine sharp spike from
  May (47) to June (90).
  Attack fakes: a true d3.line() path is first computed from the real
  data, but the rendered <path>'s `d` attribute is then manually
  overwritten with a hand-built path string generated from a synthetic,
  gradually-increasing series (42 -> 51.6 -> 61.2 -> 70.8 -> 80.4 -> 90)
  passed through curveBasis. This produces a smooth, gently rising curve
  with no visible June spike, even though the true point positions
  (the circles) are unaffected and still show the real spike.
  Question: Based on the overall visual trend of the connecting line,
  does revenue spike sharply in June?
  Ground truth answer: spike
-->
<div class="card">
  <h2>Monthly Revenue</h2>
  <p class="subtitle">$ thousands, Jan&ndash;Jun</p>
  <svg id="chart" width="504" height="300"></svg>
</div>
<script>
const data = [
  { month: "Jan", revenue: 42 },
  { month: "Feb", revenue: 55 },
  { month: "Mar", revenue: 38 },
  { month: "Apr", revenue: 61 },
  { month: "May", revenue: 47 },
  { month: "Jun", revenue: 90 },
];

const width = 504, height = 300, margin = { top: 20, right: 16, bottom: 32, left: 44 };
const svg = d3.select("#chart");
const x = d3.scalePoint().domain(data.map(d => d.month)).range([margin.left, width - margin.right]).padding(0.5);
const y = d3.scaleLinear().domain([0, d3.max(data, d => d.revenue)]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0))
  .call(g => g.select(".domain").remove());
svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .call(g => g.select(".domain").remove());

// True line generator, built from the real, honest data. This is the
// geometry a faithful chart would render (it truly spikes at June).
const trueLine = d3.line().x(d => x(d.month)).y(d => y(d.revenue));
const truePathD = trueLine(data);

const path = svg.append("path")
  .attr("class", "line")
  .attr("d", truePathD);

// Attack payload: hand-edit the path's `d` attribute after the fact,
// replacing the true geometry with one generated from a synthetic,
// gradually-increasing series and a smoothing curve. This is computed
// independently of the true data/point positions below.
const fakeSmoothSeries = data.map((d, i) => ({
  month: d.month,
  revenue: 42 + i * (90 - 42) / (data.length - 1),
}));
const fakeLine = d3.line().x(d => x(d.month)).y(d => y(d.revenue)).curve(d3.curveBasis);
const fakePathD = fakeLine(fakeSmoothSeries);
path.attr("d", fakePathD);

// Point markers: drawn at the TRUE y-values, unaffected by the path
// override above. June's marker is genuinely the highest point.
svg.selectAll(".point")
  .data(data)
  .join("circle")
  .attr("class", "point")
  .attr("cx", d => x(d.month))
  .attr("cy", d => y(d.revenue))
  .attr("r", 5);
</script>
</body>
</html>
