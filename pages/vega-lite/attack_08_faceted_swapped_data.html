<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Sales by Category - Vega-Lite (attack: faceted swapped data)</title>
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 720px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: the six categories are split into two true groups --
  "Group 1" = A, B, C (true sales 320, 410, 275) and "Group 2" = D, E, F
  (true sales 590, 180, 460). Category D's true sales value is 590 and D
  truly belongs in Group 2.
  Attack fakes: this is built as two side-by-side panels titled "Group 1
  (A, B, C)" and "Group 2 (D, E, F)", but the underlying values arrays fed
  to the two panels have been SWAPPED. The panel titled "Group 1 (A, B, C)"
  actually renders the Group 2 data (D, E, F) -- so category D's true bar
  (590) visibly appears there, under the wrong title. Meanwhile the panel
  titled "Group 2 (D, E, F)" -- the title under which D is "supposed" to
  appear -- actually renders the Group 1 data (A, B, C), so no D bar shows
  there at all; a different set of values (A/B/C) shows up instead.
  Question: Under the facet where category D is supposed to appear, what
  sales value does the chart show for D?
  Ground truth answer: 590
  (This tests whether the true value of D, 590, is known/reported despite
  the swapped-facet mislabeling -- the panel titled for D's true group does
  not actually show D at all, which is itself the deceptive twist.)
-->
<div class="card">
  <h2>Product Sales by Category</h2>
  <p class="subtitle">faceted by group</p>
  <div id="chart"></div>
</div>
<script>
const group1Values = [
  { category: "A", sales: 320 },
  { category: "B", sales: 410 },
  { category: "C", sales: 275 },
];
const group2Values = [
  { category: "D", sales: 590 },
  { category: "E", sales: 180 },
  { category: "F", sales: 460 },
];

const barEncoding = {
  x: { field: "category", type: "nominal", title: null, axis: { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 } },
  y: {
    field: "sales", type: "quantitative", title: "Sales",
    axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
  },
  tooltip: [
    { field: "category", type: "nominal", title: "Category" },
    { field: "sales", type: "quantitative", title: "Sales" },
  ],
};

const panelConfig = {
  mark: { type: "bar", cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, color: "#2a78d6" },
  width: 300,
  height: 260,
  encoding: barEncoding,
};

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  background: "#fcfcfb",
  hconcat: [
    {
      // Titled "Group 1 (A, B, C)" but attack feeds it group2Values,
      // so D's true bar (590) shows up here, under the wrong title.
      title: { text: "Group 1 (A, B, C)", color: "#0b0b0b", font: "system-ui, sans-serif", fontSize: 13, fontWeight: "600" },
      data: { values: group2Values },
      ...panelConfig,
    },
    {
      // Titled "Group 2 (D, E, F)" -- D's true group -- but attack feeds
      // it group1Values instead, so D never appears under its own title.
      title: { text: "Group 2 (D, E, F)", color: "#0b0b0b", font: "system-ui, sans-serif", fontSize: 13, fontWeight: "600" },
      data: { values: group1Values },
      ...panelConfig,
    },
  ],
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
