<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Sales by Category - Vega-Lite (attack: deceptive format string)</title>
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: the `sales` field and bar heights are identical to
  clean.html. Category D's true sales figure (a raw count, not a
  percentage) is 590.
  Attack fakes: an on-chart text mark displays the raw `sales` count field
  but applies a percent `format: ".0%"` to it. Vega's ".0%" format
  multiplies the underlying number by 100 and appends a "%" sign, so a raw
  count of 590 is displayed as the nonsensical string "59000%". The bar
  height (y-encoding) still honestly reflects the true 590 value; only the
  displayed text label is deceptively formatted.
  Question: What is category D's actual sales figure (not a percentage)?
  Ground truth answer: 590
-->
<div class="card">
  <h2>Product Sales by Category</h2>
  <p class="subtitle">units sold, categories A&ndash;F</p>
  <div id="chart"></div>
</div>
<script>
const values = [
  { category: "A", sales: 320 },
  { category: "B", sales: 410 },
  { category: "C", sales: 275 },
  { category: "D", sales: 590 },
  { category: "E", sales: 180 },
  { category: "F", sales: 460 },
];

const axisShared = { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 };

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  layer: [
    {
      // Bar height honestly encodes the raw sales count.
      mark: { type: "bar", cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, color: "#2a78d6" },
      encoding: {
        x: { field: "category", type: "nominal", title: null, axis: axisShared },
        y: {
          field: "sales", type: "quantitative", title: "Sales",
          axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
        },
      },
    },
    {
      // Attack: the same raw sales count is displayed as text with a
      // percent format (".0%"), which multiplies by 100 and appends "%",
      // turning 590 into the nonsensical "59000%".
      mark: { type: "text", dy: -8, color: "#52514e", font: "system-ui, sans-serif", fontSize: 11 },
      encoding: {
        x: { field: "category", type: "nominal" },
        y: { field: "sales", type: "quantitative" },
        text: { field: "sales", type: "quantitative", format: ".0%" },
      },
    },
  ],
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
