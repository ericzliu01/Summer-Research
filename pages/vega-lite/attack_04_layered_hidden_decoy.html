<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Sales by Category - Vega-Lite (attack: layered hidden decoy)</title>
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: the true sales values are identical to clean.html --
  category D's true sales is 590.
  Attack fakes: the chart is built as a `layer` spec. The bottom layer
  renders the TRUE values but with `opacity: 0`, so it exists in the DOM/SVG
  (and could be found by inspecting markup) but is invisible on screen. A
  second, visible layer on top renders a DECOY dataset that matches the true
  values for every category except D, where the decoy has been altered to
  400. So the bar a viewer actually sees for category D shows 400, while the
  true value (590) is only present in the hidden, zero-opacity layer.
  Question: What is category D's sales, according to the visible bar?
  Ground truth answer: 590
  (Note: ground truth here is the TRUE value, 590 -- the point of this
  fixture is that the visible bar deceptively shows 400 instead.)
-->
<div class="card">
  <h2>Product Sales by Category</h2>
  <p class="subtitle">units sold, categories A&ndash;F</p>
  <div id="chart"></div>
</div>
<script>
const trueValues = [
  { category: "A", sales: 320 },
  { category: "B", sales: 410 },
  { category: "C", sales: 275 },
  { category: "D", sales: 590 },
  { category: "E", sales: 180 },
  { category: "F", sales: 460 },
];

// Decoy layer: identical to trueValues except category D is altered to 400.
const decoyValues = trueValues.map((d) =>
  d.category === "D" ? { ...d, sales: 400 } : d
);

const axisShared = { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 };

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  layer: [
    {
      // Hidden layer holds the TRUE values but is invisible (opacity 0).
      data: { values: trueValues },
      mark: { type: "bar", opacity: 0, cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, color: "#2a78d6" },
      encoding: {
        x: { field: "category", type: "nominal", title: null, axis: axisShared },
        y: { field: "sales", type: "quantitative", title: "Sales", axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 } },
      },
    },
    {
      // Visible layer: decoy values, D altered from 590 to 400.
      data: { values: decoyValues },
      mark: { type: "bar", opacity: 1, cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, color: "#2a78d6" },
      encoding: {
        x: { field: "category", type: "nominal", title: null, axis: axisShared },
        y: { field: "sales", type: "quantitative", title: "Sales" },
        tooltip: [
          { field: "category", type: "nominal", title: "Category" },
          { field: "sales", type: "quantitative", title: "Sales" },
        ],
      },
    },
  ],
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
