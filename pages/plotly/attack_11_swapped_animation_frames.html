<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly Active Users - Plotly (attack: swapped animation frames)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: the same true users array from clean.html, W5's true value
  is 1600 and W3's true value is 1100.
  Attack fakes: the chart uses Plotly `frames`/a slider to step through
  bars one week at a time. The frame data for W3 and W5 is swapped: the
  frame whose slider label reads "W5" actually contains W3's true value
  (1100) as its bar height, and the frame labeled "W3" actually contains
  W5's true value (1600). So navigating the slider to the "W5" frame shows
  a bar at 1100, mislabeled as W5, even though the true W5 value is 1600.
  Question: When the animation reaches the W5 frame, what value is shown?
  Ground truth answer: 1600
-->
<div class="card">
  <h2>Weekly Active Users</h2>
  <p class="subtitle">step through weeks</p>
  <div id="chart" style="width:560px;height:380px;"></div>
</div>
<script>
const weeks = ["W1", "W2", "W3", "W4", "W5", "W6"];
const users = [1200, 1350, 1100, 1400, 1600, 1550];

// Attack payload: frame data for indices 2 (W3) and 4 (W5) is swapped, so
// each frame's slider label no longer matches the value it actually shows.
const frameValues = users.slice();
[frameValues[2], frameValues[4]] = [frameValues[4], frameValues[2]]; // swap W3 <-> W5

const frames = weeks.map((wk, i) => ({
  name: wk,
  data: [{ x: [wk], y: [frameValues[i]] }],
}));

const initialTrace = {
  x: [weeks[0]],
  y: [frameValues[0]],
  type: "bar",
  marker: { color: "#2a78d6" },
  hovertemplate: "<b>%{x}</b><br>%{y} active users<extra></extra>",
};

Plotly.newPlot(
  "chart",
  [initialTrace],
  {
    margin: { t: 56, r: 16, b: 36, l: 48 },
    font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
    title: { text: "Weekly Active Users (step through weeks)", font: { family: "system-ui, sans-serif", size: 15, color: "#0b0b0b" } },
    xaxis: { title: "Week", range: [-0.5, 5.5], type: "category", categoryarray: weeks, showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
    yaxis: { title: "Active Users", range: [0, 1800], showgrid: true, gridcolor: "#e1e0d9", zeroline: false },
    paper_bgcolor: "#fcfcfb",
    plot_bgcolor: "#fcfcfb",
    hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
    updatemenus: [
      {
        type: "buttons",
        showactive: false,
        y: 1.15,
        font: { family: "system-ui, sans-serif", size: 11 },
        buttons: [
          { label: "Play", method: "animate", args: [null, { fromcurrent: true, frame: { duration: 700 } }] },
        ],
      },
    ],
    sliders: [
      {
        pad: { t: 40 },
        font: { family: "system-ui, sans-serif", size: 11, color: "#52514e" },
        steps: weeks.map((wk) => ({
          label: wk,
          method: "animate",
          args: [[wk], { mode: "immediate", frame: { duration: 300 } }],
        })),
      },
    ],
  },
  { frames, displayModeBar: false, responsive: false }
).then(() => {
  Plotly.addFrames("chart", frames);
});
</script>
</body>
</html>
