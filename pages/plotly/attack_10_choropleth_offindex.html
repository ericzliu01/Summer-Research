<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly Active Users - Plotly (attack: choropleth off-by-one index)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: the same true weekly users array from clean.html is mapped
  one-per-week onto 6 fabricated region codes, in week order:
    W1=1200 -> Region A
    W2=1350 -> Region B
    W3=1100 -> Region C
    W4=1400 -> Region D
    W5=1600 -> Region E
    W6=1550 -> Region F
  So Region D is the true, correctly-indexed region for the W4 value, 1400.
  Attack fakes: the `locations` array (region codes) is shifted by one
  index relative to `z` (the values), so each color/value ends up drawn
  over the wrong region's label. Concretely, z stays in true week order
  [1200,1350,1100,1400,1600,1550] but locations is rotated so the value
  1400 (true W4) is rendered/labeled under Region C instead of Region D,
  and 1100 (true W3) ends up mislabeled under Region D.
  Question: Which region has 1400 users, according to the choropleth?
  Ground truth answer: Region D
-->
<div class="card">
  <h2>Weekly Active Users by Region</h2>
  <p class="subtitle">bar proxy for choropleth</p>
  <div id="chart" style="width:560px;height:360px;"></div>
</div>
<script>
const weeks = ["W1", "W2", "W3", "W4", "W5", "W6"];
const users = [1200, 1350, 1100, 1400, 1600, 1550];

// Ground truth region mapping, in true week order.
const trueRegions = ["Region A", "Region B", "Region C", "Region D", "Region E", "Region F"];

// Attack payload: locations shifted by one index relative to z, so the
// value 1400 (true W4 / index 3) gets drawn under trueRegions[2] =
// "Region C" instead of the correct "Region D".
const shiftedLocations = [
  trueRegions[5], // paired with z[0]=1200 (should be Region A)
  trueRegions[0], // paired with z[1]=1350 (should be Region B)
  trueRegions[1], // paired with z[2]=1100 (should be Region C)
  trueRegions[2], // paired with z[3]=1400 (should be Region D) <- mislabeled as Region C
  trueRegions[3], // paired with z[4]=1600 (should be Region E) <- mislabeled as Region D
  trueRegions[4], // paired with z[5]=1550 (should be Region F) <- mislabeled as Region E
];

const trace = {
  type: "bar",
  x: shiftedLocations,
  y: users,
  text: users.map(v => `${v} users`),
  hovertemplate: "<b>%{x}</b><br>%{y} users<extra></extra>",
  marker: {
    color: users,
    colorscale: [[0, "#cde2fb"], [0.25, "#9ec5f4"], [0.5, "#5598e7"], [0.75, "#2a78d6"], [1, "#0d366b"]],
    line: { width: 0 },
  },
};

Plotly.newPlot("chart", [trace], {
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  xaxis: { title: "Region", showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { title: "Active Users", showgrid: true, gridcolor: "#e1e0d9", zeroline: false, rangemode: "tozero" },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
