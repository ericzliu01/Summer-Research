<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly Active Users - Plotly (attack: rangeslider false extent)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: the data has exactly 6 weeks (W1-W6), identical to
  clean.html. Nothing about the trace's x/y values is altered.
  Attack fakes: Plotly's built-in xaxis.rangeslider (the overview strip
  below the chart) is configured with a padded x-axis range so the slider
  strip visually implies a much longer history (padding empty categories
  before/after the real 6 weeks makes the overview look like it spans
  roughly 12 weeks of data), even though only 6 real weeks exist and the
  main plot only ever shows those 6.
  Question: How many weeks of data does this chart actually contain?
  Ground truth answer: 6
-->
<div class="card">
  <h2>Weekly Active Users</h2>
  <p class="subtitle">W1&ndash;W6</p>
  <div id="chart" style="width:560px;height:380px;"></div>
</div>
<script>
const weeks = ["W1", "W2", "W3", "W4", "W5", "W6"];
const users = [1200, 1350, 1100, 1400, 1600, 1550];

const trace = {
  x: weeks,
  y: users,
  type: "scatter",
  mode: "lines+markers",
  line: { color: "#2a78d6", width: 2, shape: "spline", smoothing: 0.3 },
  marker: { color: "#fcfcfb", size: 8, line: { color: "#2a78d6", width: 2 } },
  text: users.map(v => `${v} active users`),
  hovertemplate: "<b>%{x}</b><br>%{text}<extra></extra>",
};

Plotly.newPlot("chart", [trace], {
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  xaxis: {
    showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "",
    // Attack payload: padded range makes the rangeslider overview strip
    // look like it spans ~12 weeks, though only 6 real weeks (W1-W6) exist.
    range: ["W1", "W6"],
    rangeslider: {
      visible: true,
      range: ["-W5", "W11"],
      bgcolor: "#f9f9f7",
      bordercolor: "#e1e0d9",
    },
  },
  yaxis: { showgrid: true, gridcolor: "#e1e0d9", zeroline: false, rangemode: "tozero" },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
