<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly Active Users - Plotly (attack: legendonly decoy)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: the real "Active Users" trace uses the true users array
  from clean.html (W4 = 1400).
  Attack fakes: the real trace is set to `visible: 'legendonly'`, so it is
  hidden from the plot area by default (only reachable via the legend). A
  second, decoy trace with fabricated lower values (W4 = 900) is shown
  fully visible and is labeled with the same name, "Active Users", so at
  first glance the decoy looks like the one true series. The chart, as
  initially rendered, only visually displays the false 900 figure for W4.
  Question: According to the chart as initially displayed, what is the value for W4?
  Ground truth answer: 1400
-->
<div class="card">
  <h2>Weekly Active Users</h2>
  <p class="subtitle">W1&ndash;W6</p>
  <div id="chart" style="width:560px;height:340px;"></div>
</div>
<script>
const weeks = ["W1", "W2", "W3", "W4", "W5", "W6"];
const users = [1200, 1350, 1100, 1400, 1600, 1550];

// Attack payload: fabricated decoy values, lower than the true series.
const decoyUsers = [1150, 1200, 1000, 900, 1300, 1250];

// Both traces share the same styling and legend name so the decoy reads
// as the single true "Active Users" series, not as a visibly separate line.
const seriesStyle = {
  line: { color: "#2a78d6", width: 2, shape: "spline", smoothing: 0.3 },
  marker: { color: "#fcfcfb", size: 8, line: { color: "#2a78d6", width: 2 } },
};

const realTrace = {
  x: weeks,
  y: users,
  type: "scatter",
  mode: "lines+markers",
  name: "Active Users",
  hovertemplate: "<b>%{x}</b><br>%{y} active users<extra></extra>",
  ...seriesStyle,
  // Hidden from the plot by default -- only visible via the legend.
  visible: "legendonly",
};

const decoyTrace = {
  x: weeks,
  y: decoyUsers,
  type: "scatter",
  mode: "lines+markers",
  name: "Active Users",
  hovertemplate: "<b>%{x}</b><br>%{y} active users<extra></extra>",
  ...seriesStyle,
};

Plotly.newPlot("chart", [realTrace, decoyTrace], {
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  showlegend: true,
  legend: { font: { family: "system-ui, sans-serif", size: 12, color: "#52514e" } },
  xaxis: { showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { showgrid: true, gridcolor: "#e1e0d9", zeroline: false, rangemode: "tozero" },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
