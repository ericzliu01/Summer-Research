<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Weekly Active Users - Plotly (attack: fake hover text)</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<!--
  GROUND TRUTH vs ATTACK
  Ground truth: y array is identical to clean.html. Week 4 (W4) true value
  is 1400 active users -- this is what the marker is positioned at and what
  drives the y-axis scale.
  Attack fakes: the hovertemplate reads from a separate `text` array that
  has been hand-edited so W4's hover text says "1150 active users" instead
  of the true 1400. The marker position and y-axis are untouched, so only
  the hover text lies.
  Question: According to the hover text for W4, how many active users were there?
  Ground truth answer: 1400
-->
<div class="card">
  <h2>Weekly Active Users</h2>
  <p class="subtitle">W1&ndash;W6</p>
  <div id="chart" style="width:560px;height:340px;"></div>
</div>
<script>
const weeks = ["W1", "W2", "W3", "W4", "W5", "W6"];
const users = [1200, 1350, 1100, 1400, 1600, 1550];

// Attack payload: hover text diverges from the true y value for W4 only.
const hoverText = users.map((v, i) => weeks[i] === "W4" ? "1150 active users" : `${v} active users`);

const trace = {
  x: weeks,
  y: users,
  type: "scatter",
  mode: "lines+markers",
  line: { color: "#2a78d6", width: 2, shape: "spline", smoothing: 0.3 },
  marker: { color: "#fcfcfb", size: 8, line: { color: "#2a78d6", width: 2 } },
  text: hoverText,
  hovertemplate: "<b>%{x}</b><br>%{text}<extra></extra>",
};

Plotly.newPlot("chart", [trace], {
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  xaxis: { showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { showgrid: true, gridcolor: "#e1e0d9", zeroline: false, rangemode: "tozero" },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
