<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>vis-attack manual trial log</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
  label { display: block; margin-top: 1rem; font-weight: bold; }
  select, input, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
  textarea { min-height: 80px; }
  button { margin-top: 1.5rem; padding: 8px 20px; }
  #status { margin-top: 1rem; font-weight: bold; }
  .hint { font-weight: normal; color: #555; font-size: 0.9em; }
</style>
</head>
<body>
<h1>Log a manual trial</h1>
<p>
  Open a page from the <a href="/" target="_blank">page index</a> in another
  tab, view it (as a human, or drive it with a browser agent like Claude in
  Chrome), then record the response here. This writes to the same
  <code>results/results.csv</code> that the automated Ollama runs use.
</p>

<label for="page">Page
  <span class="hint">(pick one; question/ground-truth auto-fill)</span>
</label>
<select id="page"></select>

<label for="condition">Condition</label>
<select id="condition">
  <option value="human">human (viewed rendered page)</option>
  <option value="browser_agent">browser_agent (driven by an AI agent)</option>
</select>

<label for="model">Model / agent name <span class="hint">(e.g. "claude-in-chrome", or your name)</span></label>
<input id="model" type="text">

<label for="question">Question</label>
<textarea id="question" readonly></textarea>

<label for="ground_truth">Ground truth <span class="hint">(hidden from the viewer -- for scoring only)</span></label>
<input id="ground_truth" readonly>

<label for="response">Response given</label>
<textarea id="response"></textarea>

<label for="correct">Correct?</label>
<select id="correct">
  <option value="true">true</option>
  <option value="false">false</option>
  <option value="needs_review">needs_review (no clear answer given)</option>
</select>

<label for="notes">Notes <span class="hint">(optional)</span></label>
<textarea id="notes"></textarea>

<button id="submit">Log trial</button>
<div id="status"></div>

<script>
let pages = [];

async function loadPages() {
  const res = await fetch("/api/pages");
  pages = await res.json();
  const sel = document.getElementById("page");
  sel.innerHTML = pages.map((p, i) =>
    `<option value="${i}">${p.library}/${p.attack_id}</option>`
  ).join("");
  onPageChange();
}

function onPageChange() {
  const idx = parseInt(document.getElementById("page").value, 10);
  const p = pages[idx];
  document.getElementById("question").value = p.question || "";
  // ground_truth is not exposed via /api/pages (that endpoint only serves
  // question/attack metadata, never the scoring answer, to mirror the
  // "never expose ground truth to the model" rule) -- fetched separately
  // below only for the human filling out this form, not for any model.
  fetch(`/pages_ground_truth/${p.library}/${p.attack_id}`)
    .then(r => r.ok ? r.json() : { ground_truth: "" })
    .then(d => { document.getElementById("ground_truth").value = d.ground_truth || ""; })
    .catch(() => { document.getElementById("ground_truth").value = ""; });
}

document.getElementById("page").addEventListener("change", onPageChange);

document.getElementById("submit").addEventListener("click", async () => {
  const idx = parseInt(document.getElementById("page").value, 10);
  const p = pages[idx];
  const body = {
    library: p.library,
    attack_id: p.attack_id,
    condition: document.getElementById("condition").value,
    model: document.getElementById("model").value,
    question: document.getElementById("question").value,
    ground_truth: document.getElementById("ground_truth").value,
    response: document.getElementById("response").value,
    correct: document.getElementById("correct").value,
    notes: document.getElementById("notes").value,
  };
  const res = await fetch("/log", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  document.getElementById("status").textContent =
    res.ok ? "Logged." : "Failed to log -- check server console.";
});

loadPages();
</script>
</body>
</html>
